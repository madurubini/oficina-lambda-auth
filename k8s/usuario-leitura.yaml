# Cria (ou atualiza) o usuário oficina_auth no RDS, com SELECT só na tabela
# cliente do schema do ambiente. É com ele que a Lambda auth-cpf consulta o
# banco: se a função tiver uma falha, não consegue alterar nem apagar dados.
#
# Roda como Job no cluster porque o RDS só aceita conexões de dentro da VPC (o
# runner do GitHub não alcança o banco). O pipeline aplica este arquivo no
# namespace do ambiente, depois de criar o Secret oficina-auth-db com:
#   PGHOST, PGUSER, PGPASSWORD, PGDATABASE  → conexão como administrador
#   SENHA_LEITURA                           → senha do oficina_auth
#   ESQUEMA                                 → homolog ou prod
# O schema e a tabela cliente já precisam existir (migrations do oficina-app).
apiVersion: batch/v1
kind: Job
metadata:
  name: usuario-leitura-auth
  labels:
    app.kubernetes.io/name: usuario-leitura-auth
    app.kubernetes.io/part-of: oficina
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: usuario-leitura-auth
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: oficina-auth-db
          env:
            - name: PGSSLMODE
              value: require
          command: ['sh', '-c']
          # As variáveis do psql (:'senha', :'esquema') entram como literais
          # escapados; o \gexec executa o comando montado pelo format().
          args:
            - |
              psql -v ON_ERROR_STOP=1 -v senha="$SENHA_LEITURA" -v esquema="$ESQUEMA" <<'SQL'
              SELECT format('CREATE ROLE oficina_auth LOGIN PASSWORD %L', :'senha')
               WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'oficina_auth') \gexec
              ALTER ROLE oficina_auth WITH LOGIN PASSWORD :'senha';
              SELECT format('GRANT USAGE ON SCHEMA %I TO oficina_auth', :'esquema') \gexec
              SELECT format('GRANT SELECT ON %I.cliente TO oficina_auth', :'esquema') \gexec
              SQL
              echo "Usuário oficina_auth pronto: SELECT em $ESQUEMA.cliente."
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
